<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const grid = $('#grid'), foot = $('#foot'), form = $('form.search'), qIn = $('#q');
  const px = (u) => '/api/ph/media?u=' + encodeURIComponent(u);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  const TABS = ['home', 'subs', 'favs', 'search', 'shorts'];
  const PATHS = { home: '/', subs: '/abos', favs: '/favoriten', search: '/suche', shorts: '/shorts' };
  const pathKind = () => { const p = location.pathname.replace(/\/+$/, '') || '/'; return TABS.find((k) => PATHS[k] === p) || 'home'; };
  function syncUrl(k) { if (PATHS[k] && (location.pathname.replace(/\/+$/, '') || '/') !== PATHS[k]) history.pushState(null, '', PATHS[k]); }
  const uHead = $('#uHead');
  let upath = '';
  let kind = store.get('ph-kind', 'home'), q = store.get('ph-q', ''), page = 0, busy = false, done = false, token = 0;
  const seen = new Set();
  const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  // Hier im Player geöffnete Videos zusätzlich lokal als gesehen merken
  const watchedSet = new Set(JSON.parse(store.get('ph-watched', '[]') || '[]'));
  function markWatched(k) {
    if (watchedSet.has(k)) return; watchedSet.add(k);
    store.set('ph-watched', JSON.stringify([...watchedSet].slice(-3000)));
    document.querySelectorAll('.card[data-k="' + k + '"]').forEach((c) => { if (!c.classList.contains('w')) { c.classList.add('w'); c.querySelector('.thumb').appendChild(el('span', 'seen', 'Gesehen')); } });
  }

  function state(html, retry) {
    foot.replaceChildren();
    const s = el('div', 'state'); s.innerHTML = html;
    if (retry) { const b = el('button', 'btn', 'Nochmal versuchen'); b.type = 'button'; b.onclick = () => { done = false; more(); }; s.appendChild(b); }
    foot.appendChild(s);
  }

  async function more() {
    if (busy || done || kind === 'shorts') return;
    if (kind === 'search' && !q.trim()) { state(smode === 'p' ? 'Gib oben einen Namen ein.' : 'Gib oben einen Suchbegriff ein.'); return; }
    if (kind === 'search' && smode === 'p') return morePeople();
    busy = true; const my = token;
    foot.replaceChildren(el('div', 'loader'));
    try {
      const p = new URLSearchParams({ kind, page: String(page + 1) }); if (kind === 'search') p.set('q', q.trim()); if (kind === 'user') { p.set('path', upath); if (uq) p.set('q', uq); } const so = sortOf(); if (so) p.set('sort', so);
      if (catsOn() && getCats().length) p.set('cats', getCats().map((c) => c.slug + (c.id ? '~' + c.id : '')).join(','));
      const r = await fetch('/api/ph/list?' + p);
      const d = await r.json().catch(() => ({}));
      if (my !== token) return;
      if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      page++;
      if (kind === 'user') $('#uInfo').textContent = (uq || userCats.length) ? (d.searched ? (d.items || []).length + ' Treffer' + (uq ? ' für „' + uq + '“' : '') + (userCats.length ? ' in ' + userCats.map((c) => c.name).join(' + ') : '') + ' unter ' + d.searched + ' Videos' + (d.partial ? ' (nicht alle durchsucht)' : '') : 'Suche …') : 'Alle Videos';
      if (kind === 'user' && d.name) { $('#uName').textContent = d.name; document.title = d.name + ' · Pornhub'; }
      if (kind === 'user' && d.avatar) setAva(d.avatar);
      const items = (d.items || []).filter((it) => !seen.has(it.key));
      items.forEach((it) => { seen.add(it.key); grid.appendChild(card(it)); });
      if (kind === 'user' && items.length) uSubInit(items[0].key);
      foot.replaceChildren();
      if (!items.length) {
        done = true;
        if (!grid.children.length) {
          if ((kind === 'subs' || kind === 'favs') && !d.login) state('Du bist im Server-Browser nicht bei Pornhub eingeloggt.<br>Melde dich einmal auf <a href="https://redswipe-login.kulbarts.com" target="_blank" rel="noopener" style="color:var(--acc)">redswipe-login.kulbarts.com</a> bei pornhub.com an.');
          else state({ subs: 'Keine Videos von deinen Abos gefunden.', favs: 'Du hast noch keine Favoriten.', user: (uq || userCats.length) ? 'Keine passenden Videos gefunden.' : 'Dieser Uploader hat keine öffentlichen Videos.' }[kind] || 'Keine Videos gefunden.');
        }
      }
    } catch (e) {
      if (my === token) state('Laden fehlgeschlagen: ' + e.message, true);
    } finally {
      if (my === token) busy = false;
    }
    if (my === token && !done && document.documentElement.scrollHeight < innerHeight * 1.5) more();
  }

  async function morePeople() {
    busy = true; const my = token;
    foot.replaceChildren(el('div', 'loader'));
    try {
      const r = await fetch('/api/ph/people?' + new URLSearchParams({ q: q.trim(), page: String(page + 1) }));
      const d = await r.json().catch(() => ({}));
      if (my !== token) return;
      if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      page++;
      const items = (d.items || []).filter((it) => !seen.has(it.path));
      items.forEach((it) => { seen.add(it.path); grid.appendChild(personCard(it)); });
      foot.replaceChildren();
      if (!items.length) { done = true; if (!grid.children.length) state('Niemanden gefunden.'); }
    } catch (e) {
      if (my === token) state('Laden fehlgeschlagen: ' + e.message, true);
    } finally { if (my === token) busy = false; }
  }
  function personCard(it) {
    const c = el('div', 'pcard'), pi = el('div', 'pimg'), img = el('img');
    img.loading = 'lazy'; img.alt = ''; if (it.img) img.src = px(it.img); pi.appendChild(img);
    c.append(pi, el('b', '', it.name), el('span', '', [it.videos, it.views].filter(Boolean).join(' · ')));
    const href = '#u=' + it.path + '&n=' + encodeURIComponent(it.name || '');
    c.addEventListener('click', (e) => { if (e.ctrlKey || e.metaKey) window.open(location.pathname + href, '_blank', 'noopener'); else location.hash = href.slice(1); });
    c.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    c.addEventListener('auxclick', (e) => { if (e.button === 1) window.open(location.pathname + href, '_blank', 'noopener'); });
    return c;
  }

  function card(it) {
    const c = el('div', 'card'); c.dataset.k = it.key; const th = el('div', 'thumb'), img = el('img');
    img.loading = 'lazy'; img.alt = ''; img.src = px(it.thumb);
    th.appendChild(img);
    if (it.duration) th.appendChild(el('span', 'dur', it.duration));
    c.append(th, el('div', 'ct', it.title));
    if (it.watched || watchedSet.has(it.key)) { c.classList.add('w'); th.appendChild(el('span', 'seen', 'Gesehen')); }
    if (it.uploader || it.views) {
      const cm = el('div', 'cm');
      if (it.uploader && it.upath) {
        const a = el('a', '', it.uploader); a.href = '#u=' + it.upath + '&n=' + encodeURIComponent(it.uploader);
        a.addEventListener('click', (e) => e.stopPropagation()); a.addEventListener('auxclick', (e) => e.stopPropagation()); cm.appendChild(a);
      } else if (it.uploader) cm.append(it.uploader);
      if (it.views) cm.append((it.uploader ? ' · ' : '') + it.views + ' Aufrufe');
      c.appendChild(cm);
    }
    // Maus: vergrößerte Karte mit Vorschau und Knöpfen
    if (canHover) {
      c.addEventListener('mouseenter', () => hovEnter(c, it));
      c.addEventListener('mouseleave', (e) => hovLeave(e));
    }
    // Lang drücken (Touch) = Schnellansicht
    let lpT = 0, lpFired = false, sx = 0, sy = 0;
    const lpStop = () => { clearTimeout(lpT); lpT = 0; };
    c.addEventListener('touchstart', (e) => {
      lpFired = false; const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
      lpT = setTimeout(() => { lpT = 0; lpFired = true; if (navigator.vibrate) navigator.vibrate(15); openPeek(it); }, 450);
    }, { passive: true });
    c.addEventListener('touchmove', (e) => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) lpStop(); }, { passive: true });
    c.addEventListener('touchend', (e) => { lpStop(); if (lpFired) e.preventDefault(); });
    c.addEventListener('touchcancel', lpStop);
    c.addEventListener('contextmenu', (e) => { if (lpT || lpFired) e.preventDefault(); });
    // Mittlere Maustaste oder Strg/Cmd+Klick = neuer Tab
    const newTab = () => window.open(location.pathname + '#v=' + it.key, '_blank', 'noopener');
    c.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
    c.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); newTab(); } });
    c.addEventListener('click', (e) => {
      if (lpFired) { lpFired = false; return; }
      if (e.ctrlKey || e.metaKey) { newTab(); return; }
      location.hash = 'v=' + it.key;
    });
    return c;
  }

  // ---------- Sortierung ----------
  const sortsEl = $('#sorts');
  function sortOpts() {
    const base = [['views', 'Meiste Aufrufe'], ['top', 'Beste Bewertung'], ['long', 'Am längsten']];
    if (kind === 'home') return [['', 'Empfohlen'], ['new', 'Neueste'], ...base];
    if (kind === 'search') return [['', 'Relevanz'], ['new', 'Neueste'], ...base];
    if (kind === 'user') return [['', 'Neueste'], ...(upath.startsWith('/channels/') ? base.slice(0, 2) : base)];
    return [];
  }
  function sortOf() { const v = store.get('ph-sort-' + kind, ''); return sortOpts().some(([k]) => k === v) ? v : ''; }
  let smode = store.get('ph-smode', 'v') === 'p' ? 'p' : 'v';
  let homeCats = []; try { homeCats = JSON.parse(store.get('ph-cats', '[]')) || []; } catch {}
  let userCats = [];
  // Kategorien der aktuellen Liste: Startseite (gemerkt) oder Creator-Seite (nur für diesen Creator)
  const catsOn = () => kind === 'home' || kind === 'user';
  const getCats = () => kind === 'user' ? userCats : kind === 'home' ? homeCats : [];
  const setCats = (a) => { if (kind === 'user') userCats = a; else homeCats = a; };
  const chip = (cls, label, fn) => { const b = el('button', 'chip ' + cls, label); b.type = 'button'; b.onclick = fn; return b; };
  function renderSorts() {
    const cur = sortOf(), row = [];
    if (kind === 'search') {
      [['v', 'Videos'], ['p', 'Personen']].forEach(([m, label]) => row.push(chip(m === smode ? 'acc' : '', label, () => {
        if (smode === m) return; smode = m; store.set('ph-smode', m); qIn.placeholder = m === 'p' ? 'Name suchen …' : 'Suchen …'; renderSorts(); reload();
      })));
    }
    if (catsOn()) {
      const sc = getCats();
      row.push(chip(sc.length ? 'acc' : '', sc.length ? 'Kategorien · ' + sc.length : 'Kategorien', openCats));
      sc.forEach((c) => { const b = chip('cat', c.name, () => { setCats(getCats().filter((x) => x.slug !== c.slug)); saveCats(); }); b.appendChild(el('i', '', '✕')); row.push(b); });
    }
    const opts = kind === 'search' && smode === 'p' ? [] : sortOpts();
    if (row.length && opts.length) row.push(el('span', 'div'));
    opts.forEach(([k, label]) => row.push(chip(k === cur ? 'on' : '', label, () => { if (k === sortOf()) return; store.set('ph-sort-' + kind, k); renderSorts(); reload(); })));
    sortsEl.hidden = !row.length;
    sortsEl.replaceChildren(...row);
    grid.classList.toggle('people', kind === 'search' && smode === 'p');
  }
  function saveCats() { if (kind === 'home') store.set('ph-cats', JSON.stringify(homeCats)); if (kind === 'user') $('#uInfo').textContent = 'Durchsuche alle Videos … (kann etwas dauern)'; renderSorts(); reload(); }

  // ---------- Kategorien-Auswahl ----------
  const catPick = $('#catPick'), cpG = $('#cpG'), cpQ = $('#cpQ');
  let allCats = null, pickSel = [];
  function cpRender() {
    const f = cpQ.value.trim().toLowerCase(), sel = new Set(pickSel.map((c) => c.slug));
    if (!allCats) { cpG.replaceChildren(el('div', 'loader')); return; }
    const list = allCats.filter((c) => !f || c.name.toLowerCase().includes(f));
    list.sort((a, b) => sel.has(b.slug) - sel.has(a.slug));
    cpG.replaceChildren(...list.map((c) => {
      const t = el('button', 'ct2' + (sel.has(c.slug) ? ' on' : '')); t.type = 'button';
      const img = el('img'); img.loading = 'lazy'; img.alt = ''; if (c.img) img.src = px(c.img);
      t.append(img, el('span', '', c.name));
      t.onclick = () => { if (sel.has(c.slug)) pickSel = pickSel.filter((x) => x.slug !== c.slug); else pickSel.push({ slug: c.slug, id: c.id || '', name: c.name }); t.classList.toggle('on'); cpBtn(); };
      return t;
    }));
    if (!list.length) cpG.replaceChildren(el('div', 'state', 'Keine Kategorie gefunden.'));
  }
  function cpBtn() { $('#cpOk').textContent = pickSel.length ? 'Anwenden (' + pickSel.length + ')' : 'Anwenden'; }
  async function openCats() {
    pickSel = getCats().slice(); cpQ.value = ''; cpBtn();
    catPick.hidden = false; document.body.style.overflow = 'hidden';
    cpRender();
    if (!allCats) {
      try {
        const r = await fetch('/api/ph/cats'); const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
        allCats = d.items || []; cpRender();
      } catch (e) { cpG.replaceChildren(el('div', 'state', 'Kategorien nicht ladbar: ' + e.message)); }
    }
  }
  function closeCats() { catPick.hidden = true; if (player.hidden && peek.hidden) document.body.style.overflow = ''; }
  cpQ.addEventListener('input', cpRender);
  $('#cpX').onclick = closeCats;
  catPick.addEventListener('click', (e) => { if (e.target === catPick) closeCats(); });
  $('#cpReset').onclick = () => { pickSel = []; cpBtn(); cpRender(); };
  $('#cpOk').onclick = () => { closeCats(); const a = getCats().map((c) => c.slug).join(), b = pickSel.map((c) => c.slug).join(); if (a !== b) { setCats(pickSel.slice()); saveCats(); } };

    pv.currentTime = Math.max(0, Math.min(pv.duration - 0.1, pv.currentTime + sec));
    seekAcc = (Math.sign(seekAcc) === Math.sign(sec) ? seekAcc : 0) + sec; clearTimeout(seekAccT); seekAccT = setTimeout(() => { seekAcc = 0; }, 900);
    flash(sec < 0 ? $('#fxL') : $('#fxR'), Math.abs(seekAcc) + ' s'); progress();
  }
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (player.requestFullscreen) player.requestFullscreen().then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch {} }).catch(() => {});
    else if (pv.webkitEnterFullscreen) pv.webkitEnterFullscreen();
  }
  cPlay.onclick = toggle; $('#cBack').onclick = () => skip(-10); $('#cFwd').onclick = () => skip(10); cFs.onclick = fullscreen;
  cMute.onclick = () => { pv.muted = !pv.muted; if (!pv.muted && pv.volume === 0) pv.volume = 1; };
  cVol.oninput = () => { pv.volume = +cVol.value; pv.muted = +cVol.value === 0; store.set('ph-vol', cVol.value); };
  pv.volume = +store.get('ph-vol', '1') || 1;
  stage.addEventListener('mousemove', wake);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  // Gesten: Halten = 2×, Doppeltipp links/rechts = ±10 s, einfacher Tipp = Leiste (Touch) bzw. Pause (Maus)
  let holdT = 0, holding = false, lastTap = 0, lastSide = '', tapT = 0, downX = 0, downY = 0;
  gz.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    downX = e.clientX; downY = e.clientY;
    holdT = setTimeout(() => { holdT = 0; holding = true; pv.playbackRate = 2; if (pv.paused) pv.play().catch(() => {}); h2x.classList.add('show'); stage.classList.add('idle'); }, 380);
  });
  const endHold = () => { clearTimeout(holdT); holdT = 0; if (holding) { holding = false; pv.playbackRate = 1; h2x.classList.remove('show'); return true; } return false; };
  gz.addEventListener('pointermove', (e) => { if (holdT && Math.hypot(e.clientX - downX, e.clientY - downY) > 12) { clearTimeout(holdT); holdT = 0; } });
  gz.addEventListener('pointercancel', endHold); gz.addEventListener('pointerleave', endHold);
  gz.addEventListener('pointerup', (e) => {
    if (e.button !== 0) return;
    if (endHold()) return;
    const r = gz.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    const side = x < 0.4 ? 'l' : x > 0.6 ? 'r' : 'c', now = performance.now();
    if (now - lastTap < 320 && side === lastSide) {
      clearTimeout(tapT); lastTap = now;
      if (side === 'l') skip(-10); else if (side === 'r') skip(10); else fullscreen();
      return;
    }
    lastTap = now; lastSide = side;
    clearTimeout(tapT);
    tapT = setTimeout(() => {
      if (isTouch) { if (stage.classList.contains('idle')) wake(); else if (pv.paused) wake(); else stage.classList.add('idle'); }
      else { toggle(); flash($('#fxC')); }
    }, isTouch ? 260 : 220);
  });

  // Zeitleiste ziehen
  let dragT = 0;
  const posT = (e) => { const r = prog.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); return { f, t: f * (pv.duration || 0) }; };
  prog.addEventListener('pointermove', (e) => { const { f, t } = posT(e); const tip = $('#pTip'); tip.style.left = f * 100 + '%'; tip.textContent = tfmt(t); if (dragging) { dragT = t; progress(); } });
  prog.addEventListener('pointerdown', (e) => { if (!pv.duration) return; dragging = true; prog.classList.add('drag'); prog.setPointerCapture(e.pointerId); dragT = posT(e).t; progress(); wake(); });
  const endDrag = (e) => { if (!dragging) return; dragging = false; prog.classList.remove('drag'); pv.currentTime = posT(e).t; progress(); wake(); };
  prog.addEventListener('pointerup', endDrag); prog.addEventListener('pointercancel', () => { dragging = false; prog.classList.remove('drag'); });

  addEventListener('keydown', (e) => {
    if (player.hidden || !peek.hidden || e.target.closest('input, select, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
    else if (k === 'arrowleft' || k === 'j') { e.preventDefault(); skip(-10); }
    else if (k === 'arrowright' || k === 'l') { e.preventDefault(); skip(10); }
    else if (k === 'f') fullscreen();
    else if (k === 'm') pv.muted = !pv.muted;
    else return;
    wake();
  });
  sync();

  // Sichtschutz: nur beim Öffnen/Neuladen der Seite, nicht beim Wechseln innerhalb der Seite
  const veil = $('#veil');
  pv.addEventListener('play', () => { if (!veil.hidden) pv.pause(); });
  function unveil(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    veil.hidden = true;
    if (!player.hidden && pv.src && (resume || !pv.currentTime)) pv.play().catch(() => {});
    resume = false;
  }
  veil.addEventListener('click', unveil);
  veil.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') unveil(e); });
  veil.focus();
  // Tab gewechselt oder Fenster minimiert: sofort wieder verdecken und anhalten
  let resume = false;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    if (!veil.hidden) return;
    resume = !player.hidden && !pv.paused;
    pv.pause(); shortsPause();
    if (!peek.hidden) closePeek();
    veil.hidden = false; veil.focus();
  });
  function closeVideo() { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); pv.playbackRate = 1; pTok++; curKey = ''; stop(); pv.removeAttribute('poster'); player.hidden = true; document.body.style.overflow = ''; document.title = kind === 'user' ? ($('#uName').textContent + ' · Pornhub') : 'Redswipe · Pornhub'; }
  function route() {
    const h = location.hash, m = h.match(/[#&]v=([A-Za-z0-9]+)/), u = h.match(/[#&]u=(\/[A-Za-z0-9_.\/-]+)/);
    if (m) { openVideo(m[1]); return; }
    if (!player.hidden) closeVideo();
    if (u) { const n = h.match(/[#&]n=([^&]*)/); openUser(u[1], n ? decodeURIComponent(n[1]) : ''); }
    else if (kind === 'user') setKind(homeKind());
  }
  $('#pBack').addEventListener('click', () => { if (history.length > 1 && location.hash) history.back(); else { location.hash = ''; } });
  addEventListener('hashchange', route);
  addEventListener('popstate', () => { if (location.hash) return; const pk = pathKind(); if (kind !== pk) setKind(pk, false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !peek.hidden) { closePeek(); return; } if (e.key === 'Escape' && !player.hidden) $('#pBack').click(); });

  store.set('ph-kind', pathKind());
  if (!/[#&]u=/.test(location.hash)) setKind(pathKind(), false);
  route();
})();
</script>
